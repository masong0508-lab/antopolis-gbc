name: Build ROM

on:
  push:
  pull_request:
  workflow_dispatch:

# A burst of rapid gameplay/UI commits should build the newest revision
# rather than queueing many obsolete ROMs and long emulator smoke runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation:
    name: ANT EYE native movement and compass tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - name: Check UI text layout and font glyphs
        run: python3 tools/test_ui_copy.py
      - name: Check generated game sprite artwork
        run: python3 tools/test_art_integrity.py

  ant-eye-emulator-smoke:
    name: Headless GBC ANT EYE emulator smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: empire-ants
          path: build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned headless Game Boy Color emulator
        run: python3 -m pip install pyboy==2.9.0 Pillow==12.0.0
      - name: Boot ROM and validate 2D / 3D screen transitions
        run: python3 -u tools/gbc_eye_smoke.py build/empire-ants.gbc --out build/eye-smoke
      - name: Keep practice queens alive and preserve normal victories
        run: python3 -u tools/gbc_queen_safety_smoke.py build/empire-ants.gbc --out build/queen-safety
      - name: Keep worker selection, movement and actions in the same location
        run: python3 -u tools/gbc_pilot_safety_smoke.py build/empire-ants.gbc --out build/pilot-safety
      - name: Reject checksum-valid battery saves with invalid live-world coordinates
        run: python3 -u tools/gbc_save_integrity_smoke.py build/empire-ants.gbc --out build/save-integrity
      - name: Verify title controls and line/page help navigation
        run: python3 -u tools/gbc_title_help_smoke.py build/empire-ants.gbc --out build/title-help
      - name: Verify hardware palettes through title and game fades
        run: python3 -u tools/gbc_palette_transition_smoke.py build/empire-ants.gbc --out build/palette-transitions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: antopolis-gbc-eye-emulator-screens
          path: |
            build/eye-smoke
            build/queen-safety
            build/pilot-safety
            build/save-integrity
            build/title-help
            build/palette-transitions
          if-no-files-found: warn


  ray-diagnostic:
    name: Diagnose GBC ANT EYE without rendering or food scan
    # These three A/B debug ROMs intentionally omit the renderer or
    # food scan and are *not* normal playable cartridges. A full-game
    # visual smoke check is not a meaningful pass/fail gate for them.
    # Keep the isolation experiments available through manual dispatch;
    # normal push/PR checks still gate on the real ROM, bank layout,
    # native tests and full real-PyBoy playthrough.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install GBDK-2020
        run: |
          curl -fsSL -o gbdk.tar.gz https://github.com/gbdk-2020/gbdk-2020/releases/latest/download/gbdk-linux64.tar.gz
          tar xzf gbdk.tar.gz
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyBoy and Pillow
        run: python3 -m pip install pyboy==2.9.0 Pillow==12.0.0
      - name: Check normal renderer without food scan
        run: |
          make GBDK_HOME="$PWD/gbdk" LCCFLAGS="-DEYE_DIAG_NO_FOOD"
          python3 -u tools/gbc_eye_smoke.py build/empire-ants.gbc --out build/eye-diag/normal-without-food
      - name: Check banked trivial food function without renderer
        if: always()
        run: |
          make clean
          make GBDK_HOME="$PWD/gbdk" LCCFLAGS="-DEYE_DIAG_NO_RAY -DEYE_DIAG_FOOD_TRIVIAL"
          python3 -u tools/gbc_eye_smoke.py build/empire-ants.gbc --diagnostic-only --out build/eye-diag/trivial-food
      - name: Check short food scan without renderer
        if: always()
        run: |
          make clean
          make GBDK_HOME="$PWD/gbdk" LCCFLAGS="-DEYE_DIAG_NO_RAY -DEYE_NAV_RADIUS=2"
          python3 -u tools/gbc_eye_smoke.py build/empire-ants.gbc --diagnostic-only --out build/eye-diag/small-food
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gbc-eye-no-ray-diag-screens
          path: build/eye-diag
          if-no-files-found: warn

  build:
    name: Build empire-ants.gbc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GBDK-2020
        run: |
          curl -fsSL -o gbdk.tar.gz https://github.com/gbdk-2020/gbdk-2020/releases/latest/download/gbdk-linux64.tar.gz
          tar xzf gbdk.tar.gz
      - name: Build
        run: |
          make GBDK_HOME="$PWD/gbdk" 2>&1 | tee build.log
          if grep -q "overflow from Bank" build.log; then echo "code overflows the 32 KB that is always mapped"; exit 1; fi
          if grep -q "excess elements in array initializer" build.log; then
            echo "error: GBC graphics table is silently dropping data"; exit 1
          fi
      - name: Verify fixed-bank trampoline layout
        run: |
          python3 - <<'PY'
          import re
          data = open('build/empire-ants.map').read()
          start = re.search(r'([0-9A-Fa-f]{8})\s+s__HOME\b', data)
          size = re.search(r'([0-9A-Fa-f]{8})\s+l__HOME\b', data)
          assert start and size, "Missing GBDK trampoline area in linker map"
          address, length = int(start[1], 16), int(size[1], 16)
          print("Bank 0 trampoline:", hex(address), "through", hex(address + length))
          # After packing the header-adjacent free space, check both
          # that trampoline calls stay in bank 0 AND no code overlaps them.
          code = re.search(r'([0-9A-Fa-f]{8})\s+s__CODE\b', data)
          code_length = re.search(r'([0-9A-Fa-f]{8})\s+l__CODE\b', data)
          assert code and code_length, "Missing _CODE area in linker map"
          code_start = int(code[1], 16)
          code_end = code_start + int(code_length[1], 16)
          assert 0x0200 <= address and address + length <= code_start < 0x4000, (
              "BANKED trampoline overlaps CRT0 startup, fixed CODE or a ROM bank"
          )
          assert code_end <= 0x8000, "Fixed _CODE exceeds the 32 KiB mapping"
          print("Fixed CODE ends:", hex(code_end), "bytes remaining:", 0x8000 - code_end)
          PY
      - name: ROM report
        run: |
          python3 - <<'PY'
          d = open('build/empire-ants.gbc','rb').read()
          print('ROM bytes:', len(d), 'banks:', len(d)//0x4000)
          for b in range(len(d)//0x4000):
              c = d[b*0x4000:(b+1)*0x4000]
              print('bank', b, 'used', max((i for i,v in enumerate(c) if v not in (0,255)), default=-1)+1, '/ 16384')
          print('header: type %02x romsize %02x ramsize %02x' % (d[0x147], d[0x148], d[0x149]))
          last = max(i for i,v in enumerate(d[:0x8000]) if v not in (0,255))
          print('last used byte of the fixed 32 KB: 0x%x (bank 2 holds text, that is fine)' % last)
          PY
          ls build
          grep -iE "_main|_dippinn_logo_play|^ *_?(CODE|HOME)|bank" build/empire-ants.map | head -40 || true
      - uses: actions/upload-artifact@v4
        with:
          name: empire-ants
          path: |
            build/empire-ants.gbc
            build/empire-ants.map
